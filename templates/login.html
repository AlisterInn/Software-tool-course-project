{% extends "base.html" %}
{% block title %}Login - ShopFlask{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Login</h1>
  <form method="post">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn btn-primary full-width">Login</button>
  </form>
  <p class="auth-link">No account? <a href="{{ url_for('register') }}">Register</a></p>
</div>
{% endblock %}
